name: Deploy to GitHub Pages

# Requires one manual step: Settings -> Pages -> Source: "GitHub Actions"
# (instead of "Deploy from a branch"). Until that's flipped, Pages keeps
# serving via the legacy branch-deploy path and this workflow is a no-op
# as far as the live site is concerned.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate-content.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
